# Public demo overrides (AWS or Oracle Cloud server). On the server, set in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# so every `docker compose` and `make` command includes this file. See docs/deployment-guide.md.
#
# Only Caddy publishes ports to the internet. Everything else keeps the 127.0.0.1 bindings from
# docker-compose.yml (reachable over an SSH tunnel for administration).

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      MAIL_VIEWER_USER: ${MAIL_VIEWER_USER:?set MAIL_VIEWER_USER in .env}
      MAIL_VIEWER_PASSWORD_HASH: ${MAIL_VIEWER_PASSWORD_HASH:?set MAIL_VIEWER_PASSWORD_HASH in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - mailpit
    mem_limit: 128m

  web:
    mem_limit: 64m

  ai-service:
    mem_limit: 512m
    environment:
      DEMO_MODE: "true"
      # Public inquiries per 24 hours across all visitors (protects the free LLM quota)
      PUBLIC_DAILY_LIMIT: ${PUBLIC_DAILY_LIMIT:-100}
      MAIL_VIEWER_PATH: /mail/
      # Set by deploy/enable-email.sh: customer emails really reach visitors (demo notice
      # instead of the STOP line, no reminders)
      CUSTOMER_EMAIL_DELIVERY: ${MAIL_RELAY_ENABLED:-false}

  migrate:
    mem_limit: 256m

  n8n:
    mem_limit: 1g

  odoo:
    mem_limit: 1536m

  odoo-db:
    mem_limit: 512m

  propflow-db:
    mem_limit: 512m

  mailpit:
    mem_limit: 128m
    environment:
      MP_WEBROOT: /mail/  # served by Caddy under https://PUBLIC_HOST/mail/ (password protected)
      MP_DATABASE: /data/mailpit.db  # keep captured emails across restarts and deploys
      MP_MAX_MESSAGES: "2000"
      # Optional real delivery (deploy/enable-email.sh): Mailpit keeps a copy of every email
      # and relays it through the configured SMTP account, except to the fictional staff and
      # test domains. Manual "release" from the viewer is disabled (allowed list matches
      # nothing), so the viewer password cannot be used to send mail to arbitrary addresses.
      MP_SMTP_RELAY_ALL: ${MAIL_RELAY_ENABLED:-false}
      MP_SMTP_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MAIL_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: plain
      MP_SMTP_RELAY_USERNAME: ${MAIL_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_OVERRIDE_FROM: ${MAIL_RELAY_USERNAME:-}
      MP_SMTP_RELAY_BLOCKED_RECIPIENTS: '@example\.(com|net|org)$$|\.(test|invalid|example|localhost)$$'
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: '^$$'
    volumes:
      - mailpit_data:/data

  greenmail:
    mem_limit: 256m  # internal only: the email-intake workflow keeps working for demos via SSH

volumes:
  caddy_data:
  caddy_config:
  mailpit_data:
