line-length = 100
target-version = "py312"
src = ["services/ai-qualification"]
extend-exclude = ["n8n", "odoo/custom_addons"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[lint.per-file-ignores]
# `env` is injected by `odoo shell`
"odoo/bootstrap/*.py" = ["F821"]
# one listing per line reads better than wrapped tuples
"database/seeds/build_properties.py" = ["E501"]
