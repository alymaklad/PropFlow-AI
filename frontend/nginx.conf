# Serves the React build and proxies the service's browser-facing APIs. Only /api/public and
# /api/staff are proxied: the n8n-facing /v1 API is not reachable through this server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Caddy (public demo) the client address arrives in X-Forwarded-For; trust it only
    # from the Docker network, so the per-visitor inquiry limit sees real visitors.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location ~ ^/api/(public|staff)/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ai-service:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    location /api/ { return 404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
